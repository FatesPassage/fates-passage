<title>Triune Domain — Skill Melding Forge</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}
body{position:fixed;inset:0;overscroll-behavior:none;touch-action:none}
.screen{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#05060a;
 --vh:1vh;--sw:min(100vw,calc(var(--vh)*100*16/9));--sh:calc(var(--sw)*9/16);--ux:calc(var(--sw)/100);--uy:calc(var(--sh)/100)}
@supports (height:100dvh){.screen{--vh:1dvh}}
/* Blurred copy of the art fills any letterbox bars so nothing looks empty */
.fill{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(22px) brightness(.45) saturate(1.2);pointer-events:none}
/* The stage keeps the artwork's exact 16:9 shape and scales to fit the phone: nothing is cropped,
   and every glow stays locked onto the art. */
.stage{position:absolute;left:50%;top:50%;width:var(--sw);height:var(--sh);transform:translate(-50%,-50%);overflow:hidden}
.background{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}

/* Full-bleed art canvas (drawn by script below). The left/right UI panels are moved out to the
   screen edges and the forge scene between them is extended, so wide phones use every pixel. */
#art{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.screen.painted #art{display:block}
.screen.painted .fill,.screen.painted .background{display:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.effects{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.core-bloom{position:absolute;left:50%;top:32%;width:calc(38*var(--ux));height:calc(42*var(--uy));transform:translate(-50%,-50%);
 background:radial-gradient(ellipse,rgba(148,93,255,.28),rgba(86,119,255,.13) 34%,rgba(75,39,132,.08) 53%,transparent 73%);
 filter:blur(13px);mix-blend-mode:screen;animation:breathe 4.8s ease-in-out infinite}
.platform-bloom{position:absolute;left:50%;top:57%;width:calc(48*var(--ux));height:calc(20*var(--uy));transform:translate(-50%,-50%);
 background:radial-gradient(ellipse,rgba(181,127,255,.24),rgba(92,62,145,.13) 40%,transparent 72%);
 filter:blur(12px);mix-blend-mode:screen;animation:platformPulse 3.6s ease-in-out infinite}
.orbit{position:absolute;left:50%;top:28%;width:min(calc(29*var(--ux)),calc(36*var(--uy)));height:min(calc(17*var(--ux)),calc(22*var(--uy)));border:2px solid rgba(190,153,255,.7);
 border-radius:50%;transform:translate(-50%,-50%) rotate(-24deg);box-shadow:0 0 8px #a77aff,inset 0 0 8px #8c6aff;
 mix-blend-mode:screen;animation:orbitA 13s linear infinite}
.orbit:after{content:"";position:absolute;inset:5px;border:1px solid rgba(115,185,255,.52);border-radius:50%;box-shadow:0 0 11px rgba(114,159,255,.55)}
.orbit.second{width:min(calc(33*var(--ux)),calc(41*var(--uy)));height:min(calc(13*var(--ux)),calc(17*var(--uy)));border-color:rgba(239,205,137,.65);transform:translate(-50%,-50%) rotate(58deg);animation:orbitB 17s linear infinite}
.orbit.third{width:min(calc(23*var(--ux)),calc(29*var(--uy)));height:min(calc(22*var(--ux)),calc(28*var(--uy)));border-color:rgba(123,103,255,.46);transform:translate(-50%,-50%) rotate(82deg);animation:orbitA 21s linear infinite reverse;opacity:.8}
.beam{position:absolute;left:50%;top:39%;height:23%;width:2px;transform:translateX(-50%);
 background:linear-gradient(transparent,rgba(175,133,255,.05),rgba(183,148,255,.75),transparent);
 filter:blur(2px);box-shadow:0 0 12px 3px rgba(150,103,255,.35);opacity:.7;animation:beamFlicker 2.5s ease-in-out infinite}
.rune-glow{position:absolute;left:50%;top:55%;width:min(calc(10*var(--ux)),calc(12*var(--uy)));height:min(calc(10*var(--ux)),calc(12*var(--uy)));transform:translate(-50%,-50%);
 border:1px solid rgba(239,202,126,.65);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
 filter:drop-shadow(0 0 10px #d7a95c);animation:runePulse 3s ease-in-out infinite}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#d9c4ff;box-shadow:0 0 8px 3px rgba(169,119,255,.7);opacity:0;animation:rise 5.5s linear infinite}
.p1{left:43%;top:57%;animation-delay:-1s}.p2{left:56%;top:48%;animation-delay:-3.2s}
.p3{left:48%;top:61%;animation-delay:-4.3s}.p4{left:60%;top:57%;animation-delay:-2.1s}
.p5{left:39%;top:47%;animation-delay:-.4s}.p6{left:52%;top:64%;animation-delay:-3.8s}
@keyframes breathe{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes platformPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes orbitA{from{transform:translate(-50%,-50%) rotate(-24deg)}to{transform:translate(-50%,-50%) rotate(336deg)}}
@keyframes orbitB{from{transform:translate(-50%,-50%) rotate(58deg)}to{transform:translate(-50%,-50%) rotate(418deg)}}
@keyframes beamFlicker{0%,100%{opacity:.35}50%{opacity:.85}}
@keyframes runePulse{0%,100%{opacity:.48;filter:drop-shadow(0 0 5px #d7a95c)}50%{opacity:1;filter:drop-shadow(0 0 16px #ffd98b)}}
@keyframes rise{0%{transform:translate3d(0,18px,0) scale(.4);opacity:0}18%{opacity:.9}80%{opacity:.65}100%{transform:translate3d(8px,-75px,0) scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.core-bloom,.platform-bloom,.orbit,.beam,.rune-glow,.particle{animation:none}}

#rot .ph:before{content:'';position:absolute;left:50%;top:5px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:rgba(190,255,225,.6)}

#rot h2{margin:6px 0 0;font:700 17px Rajdhani,sans-serif;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:#f2fff8;text-shadow:0 0 14px rgba(111,224,170,.6)}
#rot p{margin:0;font:500 13px/1.5 Rajdhani,sans-serif;letter-spacing:.16em;color:rgba(210,230,240,.78)}
#rot p b{color:#8fffc0;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
#rot .rl{width:120px;height:1px;background:linear-gradient(90deg,transparent,#6fe0aa,transparent);position:relative;overflow:hidden}
#rot .rl:after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:#fff;animation:rsw 2.4s ease-in-out infinite}
@keyframes rsw{to{left:110%}}
/* rotate screen: small logo up top, prompt in open space, small stars + planet at the bottom */
#rot{background:radial-gradient(ellipse at 20% 14%,rgba(70,50,150,.30),transparent 55%),radial-gradient(ellipse at 82% 86%,rgba(120,50,110,.20),transparent 55%),linear-gradient(#01020a,#04061a 55%,#02030c)!important}
#rot .rotart{position:absolute;left:50%;transform:translateX(-50%);height:auto;pointer-events:none;user-select:none;-webkit-user-select:none;mix-blend-mode:screen}
#rot .rotart-top{top:calc(env(safe-area-inset-top,0px) + 4vh);width:min(59.8vw,46vh)}
#rot .rotart-bot{bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);width:min(72.8vw,54.6vh);transform:translateX(-42%)}
#rot:after{content:"";position:absolute;inset:0;border:2px solid rgba(190,255,225,.85);border-radius:26px;box-shadow:0 0 18px rgba(111,224,170,.45),inset 0 0 14px rgba(111,224,170,.2);pointer-events:none;z-index:5}
#rot h2,#rot p{text-shadow:0 0 14px rgba(0,0,0,.95),0 1px 3px #000}
@media (orientation:portrait){#rot{display:flex}}
.screen{--u:calc(var(--sw)/1536)}
.ov{position:absolute;inset:0;z-index:3;pointer-events:none;font-family:Cinzel,Georgia,'Times New Roman',serif;color:#ece4cf}
.ov>*{position:absolute;box-sizing:border-box}

.mp{background:linear-gradient(160deg,rgba(14,12,24,.9),rgba(7,7,12,.9));border:1px solid #5b4f86;padding:calc(var(--u)*8) calc(var(--u)*12);display:flex;flex-direction:column;gap:calc(var(--u)*5)}
.mph{display:flex;justify-content:space-between;align-items:center;color:#e9d7a0}.mph button{pointer-events:auto;color:#d9c8ff;border:1px solid #6a58a8;padding:0 calc(var(--u)*8);background:rgba(90,70,160,.22)}
.mr{display:block;text-align:left;width:100%;color:#f0e6c8;font-family:Rajdhani,system-ui,sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mr b{font-family:Cinzel,serif;color:#e6d4ff}.mr.em{color:#6f6a80;font-weight:500}
.rs{display:flex;align-items:center;justify-content:center;color:#f1d98e;background:#0b0c11;font-weight:700;text-shadow:0 0 calc(var(--u)*10) rgba(240,200,110,.55);letter-spacing:.04em}
.sh{border-radius:calc(var(--u)*8)}
.sh.pl{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(190,150,255,0);}50%{box-shadow:0 0 calc(var(--u)*22) calc(var(--u)*2) rgba(190,150,255,.55) inset}}
.sf{display:flex;align-items:center;justify-content:center;border:calc(var(--u)*2.5) solid;background:radial-gradient(circle,#2a2146,#0a0910);box-shadow:0 0 calc(var(--u)*16) rgba(170,120,255,.6);pointer-events:none}
.sn{text-align:center;font-weight:700;text-shadow:0 0 6px #000,0 1px 2px #000;white-space:nowrap;pointer-events:none}
.mb{border-radius:calc(var(--u)*10)}.mb::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(2,3,8,.5);transition:opacity .3s}
.mb.go::after{opacity:0}.mb.go{animation:goGlow 1.8s ease-in-out infinite}
@keyframes goGlow{0%,100%{box-shadow:0 0 calc(var(--u)*14) rgba(190,150,255,.45)}50%{box-shadow:0 0 calc(var(--u)*40) calc(var(--u)*6) rgba(215,180,255,.9)}}
.cx{border-radius:50%}
.pv{background:linear-gradient(180deg,#0d0e14,#0a0b10)!important;border:1px solid #7a6a40!important;clip-path:polygon(0 calc(var(--u)*14),calc(var(--u)*14) 0,calc(100% - var(--u)*14) 0,100% calc(var(--u)*14),100% calc(100% - var(--u)*14),calc(100% - var(--u)*14) 100%,calc(var(--u)*14) 100%,0 calc(100% - var(--u)*14));text-align:center;overflow:hidden}
.pv>*{position:absolute;box-sizing:border-box;left:0;width:100%}
.pt{top:calc(var(--u)*16);color:#ead9a4;letter-spacing:.1em}
.pr{top:calc(var(--u)*52);height:1px;background:linear-gradient(90deg,transparent,#8a7440,transparent)}
.pb{display:flex!important;align-items:center;justify-content:center;border:calc(var(--u)*2) solid #6a58a8;background:radial-gradient(circle,#241c3e,#09080f);width:calc(var(--u)*88)!important}
.pb.q{border-style:dashed;color:#6f6a80}.pb.rr{border-color:#d9b8ff;box-shadow:0 0 calc(var(--u)*24) rgba(190,140,255,.55)}
.pp{left:calc(var(--u)*142)!important;width:calc(var(--u)*48)!important;top:calc(var(--u)*86);color:#e9d7a0}
.pa{top:calc(var(--u)*160);color:#e9b867}
.pb.rr{left:calc(var(--u)*108)!important;width:calc(var(--u)*116)!important}
.pn{top:calc(var(--u)*316);color:#ead9a4;padding:0 calc(var(--u)*8);letter-spacing:.04em}
.ps{top:calc(var(--u)*350);color:#bfb3d6;font-family:Rajdhani,system-ui,sans-serif;font-weight:600;padding:0 calc(var(--u)*10)}
.pd{top:calc(var(--u)*378);color:#e2e1ea;font-family:Rajdhani,system-ui,sans-serif;font-weight:500;line-height:1.3;padding:0 calc(var(--u)*20);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph{top:calc(var(--u)*440);color:#9d8fc7;letter-spacing:.14em}
/* popups */
#mod{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(2,3,8,.76);padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));touch-action:pan-y}

.mh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.mh2 b{font:800 17px Cinzel,Georgia,serif;color:#ead9a4;letter-spacing:.06em}.mh2 button{font:700 16px system-ui;color:#ece4cf;background:none;border:1px solid #6a58a8;min-width:38px;min-height:34px;cursor:pointer}

<body>
<div id="safe"></div>
<main class="screen" aria-label="Triune Domain Skill Melding Forge">

ult:["🪬","Verdict of the Paragon","Ultimate Lv 35","12m burst: 25% INT Holy damage, stun 3s; allies −20% damage taken 12s, heal 20% max HP, +20% damage 14s; taunts all enemies 4s.","30% split",5,5]
};
const CH={name:'Aldric Vael',lv:50,triune:'Paragon',res:1284350,act:SK.act,bench:SK.bench,ult:SK.ult};
/* ===== Melding rules (same ones the character sheet uses) ===== */
const ELG={dl:{n:'Divine Light',e:'💡',p:'M',c:8,ch:21,fx:['3s healing beam restoring 14% target max HP','target +8% damage for 6s']},rf:{n:'Radiant Flare',e:'☀️',p:'M',c:7,ch:20,fx:['6m cone: 10% INT Holy damage','blinds 3s']},pw:{n:'Protective Ward',e:'⛑️',p:'M',c:6,ch:20,fx:['12s ward: −14% incoming damage','reflects 7% of blocked damage as Holy damage']},be:{n:'Benediction',e:'🕊️',p:'M',c:10,ch:20,fx:['8m holy pulse heals allies 12% max HP','cleanses one debuff from each ally']},ss:{n:'Shield Smash',e:'💫',p:'E',c:7,ch:18,fx:['13% STR physical damage','2s stun']},bc:{n:'Battle Cry',e:'🗣️',p:'E',c:7,ch:16,fx:['nearby allies +12% damage for 10s','restores 8% of your max Health']}};
const MN={'dl|rf':['Dawnlance Rebuke','🌤️','Enemies blinded by the flash take 3% more damage from you for 4s.'],'dl|pw':['Gracebound Mantle','🎐','The healed ally\'s ward absorbs 3% more damage.'],'dl|be':['Mercyfall Torrent','💦','The healing beam heals 2% more for each debuff cleansed.'],'dl|ss':['Sunhammer Boon','🥘','A stunned enemy\'s threat is turned into 2% damage reduction for the healed ally for 4s.'],'dl|bc':['Valorbeam Chorus','🩩','The ally empowered by the beam also gains 3% attack speed for 4s.'],'rf|pw':['Glintguard Burst','🎑','Blinded enemies deal 3% less damage to the warded target.'],'rf|be':['Daybreak Psalm','🪷','Allies cleansed by the pulse deal 3% more Holy damage for 4s.'],'rf|ss':['Starshatter Blow','🪻','Enemies stunned by the blow take 3% more Holy damage.'],'rf|bc':['Clarion Glare','🫧','Allies empowered by the cry deal 3% more damage to blinded enemies.'],'pw|be':['Haloed Sanctuary','🪸','Allies healed by the pulse gain 3% damage reduction for 4s.'],'pw|ss':['Anvil Rebuttal','🧰','Damage reflected by the ward is 3% higher against stunned enemies.'],'pw|bc':['Bulwark Anthem','🎺','Health restored by the cry raises the ward\'s absorb by 3%.'],'be|ss':['Absolution Crash','💥','The smash also gives allies a 1% max HP/s regen for 3s.'],'be|bc':['Rousing Hymn','🎶','Allies cleansed by the pulse also gain the cry\'s damage bonus for 4s.'],'ss|bc':['Ironvoice Onslaught','🏇','Stunned enemies take 3% more damage from empowered allies.']};
function mk(a,b){const o=['dl','rf','pw','be','ss','bc'];const x=o.indexOf(a)<o.indexOf(b)?a:b,y=x==a?b:a;const A=ELG[x],B=ELG[y],m=MN[x+'|'+y];const pl=A.p==B.p?(A.p=='M'?'Mana':'Energy'):'split';return {id:x+'|'+y,pa:A.n,pb:B.n,n:m[0],e:m[1],syn:m[2],fx:A.fx.slice(0,2).concat(B.fx.slice(0,2)),cost:Math.round((A.c+B.c)/2+4)+'% '+pl,ch:Math.min(16,Math.max(12,Math.round((A.ch+B.ch)*.375)))}}

/* ===== Forge settings (edit freely) ===== */
const MAX_MELDS=3,RES_COST=[75000,150000,225000],KEY='triuneForge.aldricVael.v1',MIN_LV=50;
const ORD=['dl','rf','pw','be','ss','bc'],IDN={};ORD.forEach(k=>IDN[ELG[k].n]=k);
const COL={M:'#8fb4ff',E:'#ffb86b'};
let S={res:CH.res,done:[],sel:[null,null]};
function save(){try{localStorage.setItem(KEY,JSON.stringify({res:S.res,done:S.done}))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(!o||!Array.isArray(o.done))return;const used=[],ok=[];
 o.done.slice(0,MAX_MELDS).forEach(id=>{const p=String(id).split('|');if(p.length==2&&ELG[p[0]]&&ELG[p[1]]&&p[0]!=p[1]&&MN[id]&&!p.some(k=>used.includes(k))){ok.push(id);used.push(p[0],p[1])}});
 S.done=ok;if(typeof o.res=='number'&&o.res>=0)S.res=o.res}catch(e){}}
load();
const av=id=>!S.done.some(d=>d.split('|').includes(id));
function applyMeld(act,bench,m){const idx=act.findIndex(s=>s[1]==m.pa||s[1]==m.pb),ent=['🔀'+m.e,m.n,'Melded · '+m.pa+' + '+m.pb,m.fx.join('; ')+'. Synergy: '+m.syn,m.cost,m.ch,m.ch];
 act=act.filter(s=>s[1]!=m.pa&&s[1]!=m.pb);bench=bench.filter(s=>s[1]!=m.pa&&s[1]!=m.pb);if(idx>-1)act.splice(idx,0,ent);else bench.push(ent);return{act,bench}}
function book(){let act=CH.act.map(s=>s.slice()),bench=CH.bench.map(s=>s.slice());
 S.done.forEach(id=>{const p=id.split('|'),r=applyMeld(act,bench,mk(p[0],p[1]));act=r.act;bench=r.bench});return{act,bench}}
const nextCost=()=>S.done.length<MAX_MELDS?RES_COST[S.done.length]:null;
function checks(){const c=nextCost();return[S.sel[0]&&S.sel[1]?'ok':'idle',c!=null&&S.res>=c?'ok':'no',CH.lv>=MIN_LV&&CH.triune?'ok':'no']}
const ready=()=>S.sel[0]&&S.sel[1]&&checks().every(x=>x=='ok');

/* ===== on-art overlay (all numbers are positions on the 1536x864 artwork) ===== */
const ov=$('#ov'),u=n=>`calc(var(--u)*${n})`,P=(x,y,w,h)=>`left:${u(x)};top:${u(y)};width:${u(w)};height:${u(h)}`;
function icon(state){const s={ok:['#2f8f55','#d9ffe6','✓'],idle:['#c9ccd6','#e9ecf4','✓'],no:['#c0504a','#ffd9d6','✕']}[state];
 return `border:${u(2)} solid ${s[0]};color:${s[1]};background:${state=='ok'?'#1d5a38':'#0c0d12'}`}
function render(){const ck=checks(),b=book(),n=S.done.length,A=S.sel[0],B=S.sel[1],m=A&&B?mk(A,B):null,ok=ready();let h='';
 /* requirement icons */
 [468,500,532].forEach((y,i)=>{h+=`<div class="ic" style="${P(63,y,30,30)};${icon(ck[i])};font-size:${u(19)}">${ck[i]=='no'?'✕':'✓'}</div>`});
 /* melds panel */
 h+=`<div class="mp" style="${P(36,590,352,146)}"><div class="mph"><b style="font-size:${u(21)}">MELDS ${n}/${MAX_MELDS}</b><button data-a="book" style="font-size:${u(17)}">📖 Skill Book</button></div>`;
 for(let i=0;i<MAX_MELDS;i++){const id=S.done[i];if(id){const p=id.split('|'),mm=mk(p[0],p[1]);h+=`<button class="mr" data-a="hist" data-id="${id}" style="font-size:${u(18)}">🔀 ${mm.e} <b>${esc(mm.n)}</b></button>`}else h+=`<div class="mr em" style="font-size:${u(18)}">— unused meld —</div>`}
 h+='</div>';
 /* resonance */
 h+=`<div class="rs" style="${P(108,781,170,40)};font-size:${u(29)}">${f(S.res)}</div>`;
 /* slots */
 [543,910].forEach((x,i)=>{const id=S.sel[i],e=id?ELG[id]:null;
  h+=`<button class="sh${id?'':' pl'}" data-a="slot" data-i="${i}" style="${P(x-14,636,113,124)}" aria-label="Select ${i?'second':'first'} skill"></button>`;
  if(e)h+=`<div class="sf" style="${P(x,650,85,80)};border-color:${COL[e.p]};font-size:${u(44)}">${e.e}</div><div class="sn" style="${P(x-50,736,185,24)};font-size:${u(17)};color:${COL[e.p]}">${esc(e.n)}</div>`});
 /* meld button */
 h+=`<button class="mb${ok?' go':''}" data-a="meld" style="${P(595,768,345,62)}" aria-label="Meld skills"></button>`;
 /* close */
 h+=`<button class="cx" data-a="close" style="${P(1448,18,64,64)}" aria-label="Leave the Melding Station"></button>`;
 /* preview panel */
 const ea=A?ELG[A]:null,eb=B?ELG[B]:null,box=(e,x)=>`<div class="pb${e?'':' q'}" style="${P(x,66,88,88)};${e?'border-color:'+COL[e.p]:''};font-size:${u(42)}">${e?e.e:'?'}</div>`;
 h+=`<button class="pv" data-a="prev" style="${P(1172,162,332,466)}"><div class="pt" style="font-size:${u(24)}">MELDING PREVIEW</div><div class="pr"></div>`+
  box(ea,28)+
  `<div class="pp" style="font-size:${u(40)}">+</div>`+box(eb,216)+
  `<div class="pa" style="font-size:${u(28)}">▼</div><div class="pb rr${m?'':' q'}" style="${P(108,190,116,116)};font-size:${u(56)}">${m?m.e:'?'}</div>`+
  `<div class="pn" style="font-size:${u(25)}">${m?esc(m.n):'Choose two skills'}</div>`+
  `<div class="ps" style="font-size:${u(17)}">${m?esc(m.cost)+' · '+m.ch+' charges · '+f(nextCost()==null?0:nextCost())+' Resonance':'Tap a + slot below the forge'}</div>`+
  `<div class="pd" style="font-size:${u(17)}">${m?esc(m.syn):'Pick any two meldable skills to see what they become.'}</div>`+
  `<div class="ph" style="font-size:${u(14)}">${m?'TAP FOR FULL DETAILS':''}</div></button>`;
 ov.innerHTML=h}
/* the first-box helper above leaves the left box positioned correctly; keep markup simple */

/* ===== popups ===== */
const mod=$('#mod'),mc=$('#mc');
function open(html){mc.innerHTML=html;mod.classList.add('on');mc.scrollTop=0}
function shut(){mod.classList.remove('on');mc.innerHTML=''}
const head=t=>`<div class="mh2"><b>${t}</b><button data-m="x" aria-label="Close">✕</button></div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
function detail(m,top){return `${top||''}<div class="dt"><span class="de">🔀 ${m.e}</span><div><b class="dn">${esc(m.n)}</b><small>Melded: ${esc(m.pa)} + ${esc(m.pb)} 🔀<br>${esc(m.cost)} · ${m.ch} charges</small></div></div><ul class="fx">${m.fx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="sy">Synergy: ${esc(m.syn)}</div>`}
function openPicker(i){const b=book(),all=[...b.act,...b.bench,CH.ult],other=S.sel[1-i],cur=S.sel[i];
 let h=head(i?'Select Second Skill':'Select First Skill');if(cur)h+=`<button class="card clr" data-m="clear" data-i="${i}">↺ Clear this slot</button>`;
 const ok=[],no=[];all.forEach(s=>{const id=IDN[s[1]];(id?ok:no).push([s,id])});
 h+='<div class="sec">Meldable skills</div>';
 ok.forEach(([s,id])=>{const e=ELG[id],dis=other===id,sel=cur===id;
  h+=`<button class="card${sel?' sel':''}" ${dis?'disabled':''} data-m="pick" data-i="${i}" data-id="${id}"><span class="ce" style="border-color:${COL[e.p]}">${s[0]}</span><span class="cb"><b>${esc(s[1])}</b><small>${esc(s[2])} · ${esc(s[4])} · ${s[5]} charges</small><em>${esc(e.fx.join(' · '))}</em>${dis?'<i>In the other slot</i>':''}</span></button>`});
 h+=`<div class="sec">Cannot be melded</div>`;
 no.forEach(([s])=>{const melded=/^Melded/.test(s[2]);h+=`<div class="card off"><span class="ce">${s[0]}</span><span class="cb"><b>${esc(s[1])}</b><small>${melded?'Already a melded skill':'Only basic skills can be melded'}</small></span></div>`});
 open(h)}
function openBook(){const b=book();const row=(s,k)=>`<div class="bk${/^Melded/.test(s[2])?' mel':''}"><span>${s[0]}</span><div><b>${k?k+'. ':''}${esc(s[1])}</b><small>${esc(s[2])} · ${esc(s[4])} · ${s[5]}/${s[6]}</small></div></div>`;
 let h=head('Skill Book · '+esc(CH.name))+'<div class="sec">Active bar ('+b.act.length+'/8)</div>'+b.act.map((s,i)=>row(s,i+1)).join('')+'<div class="sec">Ultimate</div>'+row(CH.ult)+'<div class="sec">Benched</div>'+(b.bench.length?b.bench.map(s=>row(s)).join(''):'<small>None</small>')+
 `<div class="sec">Forge</div><div class="row2"><span>💎 Resonance ${f(S.res)}</span><button class="card clr" data-m="reset">Reset forge</button></div>`;open(h)}
function tryMeld(){const n=S.done.length;
 if(!(S.sel[0]&&S.sel[1]))return toast('Choose two skills first — tap a + slot.');
 if(n>=MAX_MELDS)return toast('Meld limit reached ('+MAX_MELDS+'/'+MAX_MELDS+').');
 if(CH.lv<MIN_LV)return toast('Skill Melding unlocks at level '+MIN_LV+'.');
 const c=RES_COST[n];if(S.res<c)return toast('Not enough Resonance — you need '+f(c)+'.');
 const m=mk(S.sel[0],S.sel[1]);
 open(head('Confirm Meld')+detail(m)+`<div class="warn">⚠ ${esc(m.pa)} and ${esc(m.pb)} are removed from your skill book and can't be melded again.<br>Cost: <b>💎 ${f(c)} Resonance</b> (you have ${f(S.res)}).</div><div class="btns"><button class="card" data-m="x">Cancel</button><button class="card go" data-m="do">Meld · 💎 ${f(c)}</button></div>`)}
function doMeld(){const n=S.done.length;if(!ready())return shut();const m=mk(S.sel[0],S.sel[1]),c=RES_COST[n];
 S.res-=c;S.done.push(m.id);S.sel=[null,null];save();shut();flash();render();
 setTimeout(()=>{const b=book(),k=b.act.findIndex(s=>s[1]==m.n);
  open(detail(m,'<div class="forged">✦ SKILL FORGED ✦</div>')+`<div class="sy">${k>-1?'Placed in Active bar slot '+(k+1)+'.':'Added to your benched skills.'} Resonance left: 💎 ${f(S.res)}</div><div class="btns"><button class="card go" data-m="x">Continue</button></div>`)},1100)}
function flash(){const d=document.createElement('div');d.className='flash';$('.screen').appendChild(d);setTimeout(()=>d.remove(),1700)}
function leave(){if(window.parent&&window.parent!==window){try{window.parent.postMessage({source:'triune-melding-forge',action:'close',melds:S.done.slice(),resonance:S.res},'*')}catch(e){}}
 open(head('Melding Station')+'<div class="sy">You step away from the Melding Station. Your melds are saved.</div><div class="btns"><button class="card go" data-m="x">Return to the Forge</button></div>')}

document.addEventListener('click',e=>{
 if(e.target===mod){shut();return}
 const t=e.target.closest('[data-a],[data-m]');if(!t)return;const a=t.dataset.a,m=t.dataset.m,i=+t.dataset.i;
 if(a=='slot')openPicker(i);else if(a=='meld')tryMeld();else if(a=='close')leave();else if(a=='book')openBook();
 else if(a=='prev'){if(S.sel[0]&&S.sel[1])open(head('Meld Preview')+detail(mk(S.sel[0],S.sel[1]))+`<div class="sy">Cost: 💎 ${nextCost()==null?'—':f(nextCost())} Resonance</div><div class="btns"><button class="card go" data-m="x">Close</button></div>`);else toast('Tap a + slot to choose a skill.')}
 else if(a=='hist'){const p=t.dataset.id.split('|');open(head('Melded Skill')+detail(mk(p[0],p[1]))+'<div class="btns"><button class="card go" data-m="x">Close</button></div>')}
 else if(m=='x')shut();
 else if(m=='pick'){S.sel[i]=t.dataset.id;shut();render()}
 else if(m=='clear'){S.sel[i]=null;shut();render()}
 else if(m=='do')doMeld();
 else if(m=='reset')open(head('Reset the forge?')+'<div class="sy">This restores all of Aldric\'s skills and Resonance to how they were before any melding.</div><div class="btns"><button class="card" data-m="x">Cancel</button><button class="card go" data-m="reset2">Reset</button></div>');
 else if(m=='reset2'){S={res:CH.res,done:[],sel:[null,null]};save();shut();render()}
});
render();
})();
</script>

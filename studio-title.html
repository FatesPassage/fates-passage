<script>/* Fate's Passage — audio unlock: keeps Web Audio (music + UI sounds) audible and running on phones */

  W.prototype=AC.prototype;
  try{window.AudioContext=W;window.webkitAudioContext=W;}catch(e){}
}
/* silent looping <audio>: switches iOS to the playback channel so the silent switch doesn't mute Web Audio */
var sil=null;
function mkSil(){
  try{
    var n=1600,sr=8000,b=new Uint8Array(44+n),dv=new DataView(b.buffer),i;
    function S(o,s){for(var k=0;k<s.length;k++)b[o+k]=s.charCodeAt(k);}
    S(0,'RIFF');dv.setUint32(4,36+n,true);S(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);S(36,'data');dv.setUint32(40,n,true);
    for(i=0;i<n;i++)b[44+i]=128;

  }catch(e){sil=null;}
}
function wake(){
  if(!sil)mkSil();
  if(sil&&sil.paused){try{var p=sil.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
  for(var i=0;i<all.length;i++){var c=all[i];if(c&&c.state!=='running'&&c.state!=='closed'){try{var r=c.resume();if(r&&r.catch)r.catch(function(){});}catch(e){}}}
}
['pointerdown','pointerup','touchstart','touchend','click','keydown'].forEach(function(n){addEventListener(n,wake,true);});
setInterval(wake,700);   /* recovers if the phone interrupts audio (e.g. when the intro video ends) */
})();
</script>

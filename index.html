<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080607">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/fates-passage-180.png">
  <title>Fate's Passage</title>
  <style>
    html,body { width:100%; height:100%; margin:0; background:#080607; overflow:hidden; }
  </style>
</head>
<body>
<script>
(async function () {
  const launch = () => window.location.replace("./CharacterCreation.html");
  if (!("serviceWorker" in navigator)) {
    launch();
    return;
  }
  try {
    await navigator.serviceWorker.register("./sw.js", { scope: "./" });
    // On the first online visit, wait for the offline cache installation.
    await Promise.race([
      navigator.serviceWorker.ready,
      new Promise(resolve => setTimeout(resolve, 60000))
    ]);
  } catch (error) {
    console.warn("Fate's Passage offline setup could not finish:", error);
  }
  launch();
})();
</script>
<noscript><a href="./CharacterCreation.html">Start Fate's Passage</a></noscript>
</body>
</html>

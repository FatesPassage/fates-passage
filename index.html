<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fate's Passage</title>
  <meta name="description" content="Fate's Passage MMORPG">
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(
          circle at center,
          #101827 0%,
          #05070b 65%,
          #020306 100%
        );
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .launch {
      width: min(900px, 92vw);
      text-align: center;
      padding: 60px 24px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(42px, 10vw, 88px);
      letter-spacing: 5px;
      text-shadow:
        0 0 12px rgba(255,255,255,.15),
        0 0 35px rgba(120,160,255,.18);
    }
    .subtitle {
      margin: 0 0 42px;
      color: rgba(255,255,255,.68);
      font-size: clamp(14px, 3vw, 20px);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .begin {
      display: inline-block;
      min-width: 240px;
      padding: 17px 38px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 8px;
      color: #ffffff;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 2px;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.14),
          rgba(255,255,255,.04)
        );
      box-shadow:
        inset 0 1px rgba(255,255,255,.18),
        0 0 0 1px rgba(0,0,0,.35),
        0 12px 35px rgba(0,0,0,.45);
      transition:
        transform .15s ease,
        background .15s ease,
        box-shadow .15s ease;
    }
    .begin:hover {
      transform: translateY(-2px);
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.22),
          rgba(255,255,255,.08)
        );
      box-shadow:
        inset 0 1px rgba(255,255,255,.22),
        0 14px 42px rgba(0,0,0,.55);
    }
    .begin:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 30px;
      font-size: 12px;
      color: rgba(255,255,255,.35);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="launch">
    <h1>Fate's Passage</h1>
    <p class="subtitle">
      Enter the Passage
    </p>
    <!--
      This is the current game entry point.
      The obsolete Character Creation 3 page is no longer used.
    -->
    <a class="begin" href="./FatesPassage.html">
      Begin
    </a>
    <div class="note">
      Fate's Passage
    </div>
  </main>
</body>
</html>

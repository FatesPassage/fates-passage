<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080607">
  <title>Fate's Passage</title>
  <style>
    html, body { height: 100%; margin: 0; background: #080607; color: #e8dcc8; font-family: Georgia, serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; }
    a { color: #e8dcc8; }
  </style>
</head>
<body>
  <div>
    <p>Loading Fate's Passage…</p>
    <p><a href="./character-creation.html">Tap here if it doesn't open</a></p>
  </div>
  <script>
    (function () {
      var go = function () { location.replace("./character-creation.html"); };
      if (!("serviceWorker" in navigator)) { go(); return; }
      var timer = setTimeout(go, 5000);
      navigator.serviceWorker.register("./sw.js")
        .then(function () { return navigator.serviceWorker.ready; })
        .then(function () { clearTimeout(timer); go(); })
        .catch(function () { clearTimeout(timer); go(); });
    })();
  </script>
</body>
</html>
